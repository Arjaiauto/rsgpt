<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuepoint Global Components</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>

/* Layout: sticky top bar; heading + toolbar; responsive card grid (4/3/2/1) */
:root{
  --paper:#101117; --paper-lit:#1a1b24; --paper-edge:#08090c;
  --surface:#15161e; --raised:#1d1e28; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --ink:#f2f2f5; --ink-soft:rgba(242,242,245,.6); --ink-faint:rgba(242,242,245,.4);
  --violet:#5b07fb; --violet-deep:#4a00d6; --violet-text:#a58bff; --cite:#4fe3c1;
  --gutter:clamp(16px,3.2vw,46px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Inter","Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%,var(--paper-lit) 0%,var(--paper) 55%,var(--paper-edge) 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--violet-text);outline-offset:3px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:26px;height:60px;
  padding-left:max(16px,var(--gutter),env(safe-area-inset-left,0px));padding-right:max(16px,var(--gutter),env(safe-area-inset-right,0px));
  background:rgba(16,17,23,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:20px;color:var(--ink);text-decoration:none}
.mk{width:26px;height:26px;flex:none;display:block}
.wm{font-weight:600;letter-spacing:-.05em;white-space:nowrap}
.ci{display:inline-block;position:relative;width:.27em;height:.545em;vertical-align:baseline}
.ci i{position:absolute;left:.075em;bottom:0;width:.12em;height:.545em;border-radius:.06em;background:currentColor}
.ci i::after{content:"";position:absolute;left:50%;top:-.33em;width:.25em;height:.21em;margin-left:-.125em;background:var(--cite);clip-path:polygon(6% 0,94% 0,50% 100%)}
.links{display:flex;gap:22px;font-size:15px;letter-spacing:-.02em}
.links a{color:var(--ink-soft);text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.links a[aria-current]{color:var(--ink);border-color:var(--violet)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(140deg,#7c3cff,#2bb79a)}


/* Layout: sticky top bar (logo, links, quick search, avatar); mockup state strip; page view; floating mini player; toasts stack bottom-centre */
.bar{gap:22px}
.qs{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;min-width:220px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);color:var(--ink-faint);font-size:14px;cursor:pointer;margin-left:auto}
.qs:hover{border-color:rgba(255,255,255,.28);color:var(--ink-soft)}
.qs svg{width:16px;height:16px;flex:none}
.qs kbd{margin-left:auto;font:500 12px var(--sans);padding:2px 7px;border-radius:6px;border:1px solid var(--line-strong);color:var(--ink-soft)}
.me{margin-left:0}
.links button{all:unset;cursor:pointer;color:var(--ink-soft);padding:6px 0;border-bottom:2px solid transparent}
.links button:hover{color:var(--ink)}
.links button[aria-current]{color:var(--ink);border-color:var(--violet)}
.links button:focus-visible{outline:2px solid var(--violet-text);outline-offset:3px;border-radius:4px}
.menu{display:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:none;cursor:pointer;place-items:center}
.menu svg{width:18px;height:18px}
.drop{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:0;right:0;z-index:19;background:rgba(16,17,23,.97);border-bottom:1px solid var(--line);padding:8px max(16px,var(--gutter)) 16px;display:grid;gap:2px}
.drop button{all:unset;cursor:pointer;padding:12px 4px;font-size:16px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.drop button[aria-current]{color:var(--ink)}

.wrap{max-width:1120px;margin:0 auto;padding:22px max(16px,var(--gutter)) 140px}
.mock{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:14px;font-size:13px;color:var(--ink-faint);margin-bottom:28px}
.mock b{font-weight:600;color:var(--ink-soft);letter-spacing:.06em;font-size:11px;text-transform:uppercase}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg button{all:unset;cursor:pointer;padding:6px 13px;border-radius:999px;font-size:13px;color:var(--ink-soft)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.seg button:focus-visible{outline:2px solid var(--violet-text)}
.tag{margin-left:auto;font-size:11px;letter-spacing:.08em;padding:4px 9px;border-radius:999px;border:1px solid var(--line-strong)}

h1{font-size:clamp(26px,3.2vw,34px);letter-spacing:-.04em;font-weight:600;margin:0 0 6px}
.sub{color:var(--ink-soft);margin:0 0 26px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line-strong);background:none;cursor:pointer;font-size:14px;color:var(--ink)}
.pill:hover{background:rgba(255,255,255,.05)}
.pill.pri{background:var(--violet);border-color:var(--violet)}
.pill.pri:hover{background:var(--violet-deep)}
.pill[disabled]{opacity:.4;cursor:not-allowed}
.pill.on{border-color:var(--violet-text);color:var(--violet-text)}
.pill svg{width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}

/* big player */
.player{overflow:hidden;margin-bottom:22px}
.screenv{position:relative;aspect-ratio:16/9;max-height:440px;width:100%;background:radial-gradient(90% 120% at 30% 20%,#2a1670 0%,#141026 55%,#0b0b12 100%);display:grid;place-items:center;cursor:pointer}
.screenv .wave{position:absolute;left:8%;right:8%;bottom:16%;height:34%;display:flex;align-items:center;gap:3px;opacity:.5}
.screenv .wave i{flex:1;border-radius:2px;background:#fff;opacity:.5}
.screenv .wave i.p{background:var(--cite);opacity:.9}
.big{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);z-index:1}
.big svg{width:24px;height:24px}
.lab{position:absolute;left:16px;top:14px;font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
.pmeta{padding:16px 18px 18px;display:grid;gap:12px}
.pmeta .t{font-size:17px;font-weight:600;letter-spacing:-.02em}
.pmeta .g{font-size:14px;color:var(--ink-soft)}
.ts{color:var(--cite);font-variant-numeric:tabular-nums;font-weight:500}
.track{height:4px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;cursor:pointer}
.track span{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--cite)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .time{font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums;margin-right:auto}

/* lists and grids */
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px}
.item .th{width:84px;aspect-ratio:16/9;border-radius:10px;flex:none;background:radial-gradient(120% 120% at 20% 20%,#3a1d8f,#13111f);display:grid;place-items:center;cursor:pointer;border:none}
.item .th svg{width:16px;height:16px}
.item .tx{flex:1;min-width:0}
.item .tx div:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx div+div{font-size:13px;color:var(--ink-soft);margin-top:3px}
.item.now{border-color:rgba(79,227,193,.4)}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink-soft);flex:none}
.ib:hover{color:var(--ink);border-color:var(--line-strong)}
.ib svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gc{padding:18px;display:grid;gap:10px}
.gc .ini{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--raised);border:1px solid var(--line-strong)}
.gc .n{font-weight:600}.gc .r{font-size:13px;color:var(--ink-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{padding:20px}
.stat .v{font-size:36px;font-weight:600;letter-spacing:-.04em}
.stat .k{font-size:14px;color:var(--ink-soft);margin-top:4px}
.doc{padding:24px;display:grid;gap:12px;max-width:720px}
.doc h3{margin:6px 0 0;font-size:15px}
.doc p{margin:0;color:var(--ink-soft);line-height:1.55;font-size:15px}
.ans{padding:20px;margin-bottom:16px;line-height:1.6;color:var(--ink-soft);font-size:15px}
.ans .q{color:var(--ink);font-weight:600;font-size:18px;letter-spacing:-.02em;margin-bottom:10px}

/* states */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.09) 40%,rgba(255,255,255,.04) 80%);background-size:300% 100%;animation:shim 1.3s linear infinite;border-radius:10px}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}
.skl{height:12px;border-radius:6px}
.empty{padding:52px 24px;display:grid;justify-items:center;text-align:center;gap:12px}
.empty .ico{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line-strong)}
.empty .ico svg{width:26px;height:26px;color:var(--violet-text)}
.empty h2{margin:6px 0 0;font-size:20px;letter-spacing:-.03em}
.empty p{margin:0;color:var(--ink-soft);max-width:420px;line-height:1.5;font-size:15px}
.empty .row{justify-content:center;margin-top:6px}
.err .ico svg{color:#ffb86b}

/* mini player */
.mini{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:360px;max-width:calc(100% - 32px);padding:10px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;border-radius:18px;background:rgba(29,30,40,.96);border:1px solid var(--line-strong);box-shadow:0 18px 50px rgba(0,0,0,.55);animation:rise .3s var(--ease) both}
.mini .th{width:92px;aspect-ratio:16/9;border-radius:10px;background:radial-gradient(120% 120% at 20% 20%,#3a1d8f,#13111f);display:grid;place-items:center;border:none;cursor:pointer}
.mini .th svg{width:18px;height:18px}
.mini .tx{min-width:0;font-size:13px}
.mini .tx div:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.mini .tx div+div{color:var(--ink-soft);margin-top:2px}
.mini .acts{display:flex;gap:4px}
.mini .track{grid-column:1/-1;height:3px}
.mini .back{font-size:12px;color:var(--violet-text);background:none;border:none;cursor:pointer;padding:0;margin-top:4px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* toasts */
.toasts{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;transition:bottom .25s var(--ease)}
.has-mini .toasts{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:10px 12px 10px 16px;border-radius:999px;background:var(--raised);border:1px solid var(--line-strong);font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:rise .3s var(--ease) both}
.toast .ok{width:18px;height:18px;flex:none;color:var(--cite)}
.toast button{background:none;border:none;color:var(--violet-text);font-weight:600;cursor:pointer;padding:2px 4px}
.toast.out{opacity:0;transform:translateY(8px);transition:.25s}

/* dialogs */
dialog{border:1px solid var(--line-strong);border-radius:20px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100% - 32px));box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,5,9,.66);backdrop-filter:blur(3px)}
.dh{padding:20px 22px 8px;display:flex;align-items:flex-start;gap:12px}
.dh h2{margin:0;font-size:19px;letter-spacing:-.03em}
.dh p{margin:4px 0 0;font-size:13px;color:var(--ink-soft)}
.dh .ib{margin-left:auto}
.db{padding:10px 22px 4px;display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:15px}
.opt:has(input:checked){border-color:var(--violet-text);background:rgba(91,7,251,.12)}
.opt input{accent-color:var(--violet);width:16px;height:16px;margin:0}
.opt small{display:block;color:var(--ink-faint);font-size:12px;margin-top:2px}
textarea{width:100%;min-height:78px;resize:vertical;border-radius:12px;border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);padding:10px 12px;font:15px var(--sans);margin-top:6px}
.cnt{font-size:12px;color:var(--ink-faint);text-align:right}
.df{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.df .note{margin-right:auto;font-size:12px;color:var(--ink-faint);max-width:220px}

.pal{width:min(640px,calc(100% - 32px));margin-top:12vh}
.pin{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pin svg{width:18px;height:18px;color:var(--ink-faint);flex:none}
.pin input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:17px;color:var(--ink)}
.pin kbd{font:500 12px var(--sans);padding:2px 7px;border-radius:6px;border:1px solid var(--line-strong);color:var(--ink-faint)}
.pres{max-height:min(420px,56vh);overflow:auto;padding:8px}
.pg{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:10px 10px 4px}
.pr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;font-size:15px}
.pr[aria-selected=true]{background:var(--raised)}
.pr .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);flex:none;font-size:12px}
.pr[aria-selected=true] .k{background:var(--violet);border-color:var(--violet)}
.pr .k svg{width:14px;height:14px}
.pr .s{margin-left:auto;font-size:12px;color:var(--ink-faint)}
.pfoot{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint)}
.pnone{padding:26px;text-align:center;color:var(--ink-soft);font-size:14px}

@media (max-width:820px){
  .links{display:none}.menu{display:grid}
  .qs{min-width:0;width:38px;padding:0;justify-content:center;margin-left:auto}
  .qs span,.qs kbd{display:none}
  .me span:last-child{display:none}
  .bar{gap:10px}
  .mini{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-width:none;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .mini .th{width:72px}
  .item .th{width:64px}
  .tag{margin-left:0}
  dialog{margin-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:100%}
  .pal{margin-top:8px;border-radius:20px}
  .pin kbd,.pfoot span:first-child{display:none}
  .df{flex-wrap:wrap}.df .note{flex-basis:100%;max-width:none;margin-bottom:4px}.df .pill{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.mini,.toast{animation:none}.toasts{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><linearGradient id="cp-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3cff"/><stop offset=".55" stop-color="#5b07fb"/><stop offset="1" stop-color="#3a0aa8"/></linearGradient></defs>
  <symbol id="cp-mark" viewBox="0 0 56 56">
    <rect width="56" height="56" rx="16" fill="url(#cp-g)"/>
    <g fill="#fff" opacity=".38"><rect x="10.5" y="27" width="3.2" height="8" rx="1.6"/><rect x="16.8" y="22.5" width="3.2" height="17" rx="1.6"/><rect x="36" y="20.5" width="3.2" height="21" rx="1.6"/><rect x="42.3" y="25" width="3.2" height="12" rx="1.6"/></g>
    <rect x="25.4" y="19" width="5.2" height="26" rx="2.6" fill="#fff"/>
    <path d="M20.6 9.6h14.8a1.6 1.6 0 0 1 1.2 2.7l-7.4 7.6a1.6 1.6 0 0 1-2.3 0l-7.4-7.6a1.6 1.6 0 0 1 1.1-2.7z" fill="#4fe3c1"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4m0 1h11l-2 4 2 4H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bm" viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.5 4.3 4.3 0 0 0 7 18z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M5 12l7-7 7 7M12 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-ep" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></symbol>
  <symbol id="i-page" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-ask" viewBox="0 0 24 24"><path d="M5 18.5V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
</svg>

<header class="bar">
  <a class="logo" href="#" id="home"><svg class="mk" aria-hidden="true"><use href="#cp-mark"/></svg><span class="sr">Cuepoint</span><span class="wm" aria-hidden="true">cuepo<span class="ci"><i></i></span>nt</span></a>
  <nav class="links" aria-label="Main" id="links"></nav>
  <button class="qs" id="qs" aria-label="Quick search" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#i-search"/></svg><span>Search guests, episodes…</span><kbd id="kbd">Ctrl K</kbd></button>
  <div class="me"><span class="av" aria-hidden="true">A</span><span>Hi Arjun</span></div>
  <button class="menu" id="menu" aria-label="Menu" aria-expanded="false"><svg aria-hidden="true"><use href="#i-menu"/></svg></button>
</header>
<div class="drop" id="drop" hidden></div>

<main class="wrap">
  <div class="mock" role="group" aria-label="Mockup controls">
    <b>Mockup controls</b>
    <div class="seg" id="seg">
      <button data-m="normal" aria-pressed="true">Normal</button>
      <button data-m="loading" aria-pressed="false">Loading</button>
      <button data-m="empty" aria-pressed="false">Empty</button>
      <button data-m="error" aria-pressed="false">Error</button>
    </div>
    <span>Play a clip, then switch pages to see the mini player.</span>
    <span class="tag">SAMPLE DATA</span>
  </div>
  <div id="view" aria-live="polite"></div>
</main>

<div class="mini" id="mini" hidden role="region" aria-label="Now playing">
  <button class="th" id="mPlay" aria-label="Pause"><svg aria-hidden="true"><use href="#i-pause"/></svg></button>
  <div class="tx"><div id="mT"></div><div><span class="ts" id="mTs"></span> · <span id="mG"></span></div><button class="back" id="mBack">Back to source ↗</button></div>
  <div class="acts"><button class="ib" id="mClose" aria-label="Close player"><svg aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="track" id="mTrack"><span id="mBar"></span></div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<dialog id="rep" aria-labelledby="repT">
  <form method="dialog" id="repF">
    <div class="dh"><div><h2 id="repT">Report an error</h2><p id="repS"></p></div><button class="ib" value="cancel" formnovalidate aria-label="Close"><svg aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="db" id="repO"></div>
    <div class="db"><label for="repN" style="font-size:14px;color:var(--ink-soft)">Note (optional)</label><textarea id="repN" maxlength="280" placeholder="E.g. the quote starts about 20 seconds later"></textarea><div class="cnt" id="repC">0 / 280</div></div>
    <div class="df"><span class="note">Goes to the review queue. The item stays visible until checked.</span><button class="pill" value="cancel" formnovalidate>Cancel</button><button class="pill pri" id="repGo" value="send" disabled>Send report</button></div>
  </form>
</dialog>

<dialog id="pal" class="pal" aria-label="Quick search">
  <div class="pin"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="pq" placeholder="Search guests, episodes, pages… or ask a question" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="pres"><kbd>Esc</kbd></div>
  <div class="pres" id="pres" role="listbox"></div>
  <div class="pfoot"><span>↑ ↓ to move</span><span>Enter to open</span><span>Esc to close</span></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const ico = (id, cls = "") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const PAGES = [["ask", "Ask"], ["guests", "Guests"], ["prep", "Prep brief"], ["clips", "Clips"], ["saved", "Saved"], ["insights", "Insights"]];
/* sample clips: id, title, guest, episode, start (s), length (s), source page */
const CLIPS = [
  { id: "c1", t: "Why most first businesses fail in year two", g: "Sample guest A · Founder", ep: "Ep 412", st: 1122, len: 74, src: "ask" },
  { id: "c2", t: "Pricing a product for small-town India", g: "Sample guest B · D2C founder", ep: "Ep 388", st: 2410, len: 52, src: "clips" },
  { id: "c3", t: "The first hire nobody talks about", g: "Sample guest C · Investor", ep: "Ep 351", st: 845, len: 61, src: "clips" },
  { id: "c4", t: "What changed after the second fundraise", g: "Sample guest D · Founder", ep: "Ep 297", st: 3302, len: 88, src: "clips" },
];
const GUESTS = [["Sample guest A", "Founder · 3 episodes"], ["Sample guest B", "D2C founder · 1 episode"], ["Sample guest C", "Investor · 2 episodes"], ["Sample guest D", "Founder · 1 episode"], ["Sample guest E", "Actor · 1 episode"], ["Sample guest F", "Doctor · 2 episodes"]];

let page = "ask", mode = "normal", loadT = 0;
let saved = new Set(["c2", "c3"]), reported = new Set();
const P = { clip: null, pos: 0, playing: false, raf: 0, last: 0 };

/* ---------- nav ---------- */
function navHTML() { return PAGES.map(([k, l]) => `<button data-p="${k}"${k === page ? ' aria-current="page"' : ""}>${l}</button>`).join(""); }
function renderNav() { $("#links").innerHTML = navHTML(); $("#drop").innerHTML = navHTML(); }
document.addEventListener("click", e => { const b = e.target.closest("[data-p]"); if (b) { go(b.dataset.p); closeDrop(); } });
$("#home").addEventListener("click", e => { e.preventDefault(); go("ask"); });
$("#menu").addEventListener("click", () => { const open = $("#drop").hidden; $("#drop").hidden = !open; $("#menu").setAttribute("aria-expanded", open); });
function closeDrop() { $("#drop").hidden = true; $("#menu").setAttribute("aria-expanded", "false"); }

function go(p, instant) {
  page = p; renderNav(); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  clearTimeout(loadT);
  if (mode === "normal" && !instant) { render("loading"); loadT = setTimeout(() => render(), 650); } else render();
}

/* ---------- views ---------- */
const HEAD = {
  ask: ["Ask", "Ask anything across 500 episodes. Every answer links to its source."],
  guests: ["Guests", "Everyone who has been on the show."],
  prep: ["Prep brief", "One page on a guest before you record."],
  clips: ["Clips", "Short moments, ready to cut."],
  saved: ["Saved", "Clips, answers and briefs you kept."],
  insights: ["Insights", "What works across the archive."],
};
const EMPTY = {
  ask: ["i-ask", "Ask your first question", "Try a topic, a guest, or paste a line you remember.", [["Try: first hire", "pri"], ["Find a line", ""]]],
  guests: ["i-user", "No guests match “cricket coach”", "Try a shorter name, or clear the filters.", [["Clear filters", "pri"]]],
  prep: ["i-user", "Pick a guest to build a brief", "Search a name and Cuepoint pulls their past episodes, best moments and open questions.", [["Choose a guest", "pri"]]],
  clips: ["i-ep", "No clips match these filters", "Widen the length range or remove a mood.", [["Reset filters", "pri"]]],
  saved: ["i-bm", "Nothing saved yet", "Tap Save on any answer, clip or brief and it shows up here.", [["Browse clips", "pri"]]],
  insights: ["i-ep", "No episodes in this range", "Pick a wider year range to see patterns.", [["Show all years", "pri"]]],
};

function render(force) {
  const m = force || mode, v = $("#view"), [h, s] = HEAD[page];
  let body = "";
  if (m === "loading") body = skel();
  else if (m === "empty" || (page === "saved" && !saved.size)) body = emptyHTML(page);
  else if (m === "error") body = `<div class="card empty err"><div class="ico">${ico("i-cloud")}</div><h2>Couldn’t reach the archive</h2><p>Check your connection and try again. Nothing you saved is lost.</p><div class="row"><button class="pill pri" id="retry">Try again</button></div></div>`;
  else body = views[page]();
  v.setAttribute("aria-busy", m === "loading");
  v.innerHTML = `<h1>${h}</h1><p class="sub">${s}</p>${body}`;
  syncPlayer();
}
function emptyHTML(p) {
  const [i, t, d, btns] = EMPTY[p];
  return `<div class="card empty"><div class="ico">${ico(i)}</div><h2>${esc(t)}</h2><p>${esc(d)}</p><div class="row">${btns.map(([l, c]) => `<button class="pill ${c}" data-e="${p}">${esc(l)}</button>`).join("")}</div></div>`;
}
function skel() {
  const line = w => `<div class="sk skl" style="width:${w}%"></div>`;
  if (page === "guests") return `<div class="grid">${Array(6).fill(`<div class="card gc"><div class="sk" style="width:56px;height:56px;border-radius:50%"></div>${line(70)}${line(45)}</div>`).join("")}</div>`;
  if (page === "insights") return `<div class="stats">${Array(3).fill(`<div class="card stat" style="display:grid;gap:12px"><div class="sk" style="height:34px;width:50%"></div>${line(80)}</div>`).join("")}</div>`;
  const rows = Array(4).fill(`<div class="card item"><div class="sk" style="width:84px;aspect-ratio:16/9;flex:none"></div><div style="flex:1;display:grid;gap:8px">${line(70)}${line(40)}</div></div>`).join("");
  if (page === "ask" || page === "clips") return `<div class="card" style="margin-bottom:22px;overflow:hidden"><div class="sk" style="aspect-ratio:16/9;max-height:440px;border-radius:0"></div><div style="padding:18px;display:grid;gap:10px">${line(55)}${line(30)}</div></div>` + (page === "clips" ? `<div class="list">${rows}</div>` : "");
  if (page === "prep") return `<div class="card doc">${line(40)}${line(95)}${line(90)}${line(70)}${line(35)}${line(92)}${line(60)}</div>`;
  return `<div class="list">${rows}</div>`;
}
function bigPlayerHTML(c) {
  const bars = Array.from({ length: 64 }, (_, i) => `<i style="height:${18 + Math.abs(Math.sin(i * 1.7) * 60 + Math.sin(i * .5) * 22)}%"></i>`).join("");
  const sv = saved.has(c.id), rp = reported.has(c.id);
  return `<div class="card player" data-clip="${c.id}">
    <div class="screenv" data-toggle="${c.id}" role="button" tabindex="0" aria-label="Play or pause"><span class="lab">${esc(c.ep)} · video plays here (YouTube no-cookie player in the real site)</span><div class="wave" aria-hidden="true">${bars}</div><div class="big" id="bigBtn">${ico("i-play")}</div></div>
    <div class="pmeta">
      <div><div class="t">${esc(c.t)}</div><div class="g">${esc(c.g)} · ${esc(c.ep)} · starts <span class="ts">${fmt(c.st)}</span></div></div>
      <div class="track" data-seek="${c.id}"><span id="bigBar" style="width:0"></span></div>
      <div class="row"><span class="time" id="bigTime">0:00 / ${fmt(c.len)}</span>
        <button class="pill${sv ? " on" : ""}" data-save="${c.id}">${sv ? "Saved ✓" : "Save"}</button>
        <button class="pill" data-copy="${c.id}">Copy link</button>
        <button class="pill" data-dl="${c.id}">Download</button>
        <button class="pill" data-rep="${c.id}"${rp ? " disabled" : ""}>${ico("i-flag")}${rp ? "Reported" : "Report"}</button>
      </div>
    </div></div>`;
}
function rowHTML(c) {
  const sv = saved.has(c.id);
  return `<div class="card item${P.clip && P.clip.id === c.id ? " now" : ""}"><button class="th" data-play="${c.id}" aria-label="Play ${esc(c.t)}">${ico("i-play")}</button>
    <div class="tx"><div>${esc(c.t)}</div><div>${esc(c.g)} · ${esc(c.ep)} · <span class="ts">${fmt(c.st)}</span> · ${c.len}s</div></div>
    <button class="ib" data-save="${c.id}" aria-label="${sv ? "Remove from saved" : "Save"}" style="${sv ? "color:var(--violet-text);border-color:var(--violet-text)" : ""}">${ico("i-bm")}</button>
    <button class="ib" data-rep="${c.id}" aria-label="Report an error">${ico("i-flag")}</button></div>`;
}
const views = {
  ask: () => `<div class="card ans"><div class="q">Why do most first businesses fail in year two?</div>Guests keep coming back to two reasons: cash runs out before repeat customers arrive, and founders hire for growth before the product is settled. The clearest version is below <span class="ts">${fmt(1122)}</span>.</div>${bigPlayerHTML(CLIPS[0])}`,
  clips: () => { const c = P.clip && P.clip.src === "clips" ? P.clip : CLIPS[1]; return bigPlayerHTML(c) + `<div class="list">${CLIPS.slice(1).map(rowHTML).join("")}</div>`; },
  guests: () => `<div class="grid">${GUESTS.map(([n, r]) => `<div class="card gc"><div class="ini">${n.slice(-1)}</div><div class="n">${esc(n)}</div><div class="r">${esc(r)}</div></div>`).join("")}</div>`,
  prep: () => `<div class="card doc"><div style="font-size:13px;color:var(--ink-faint)">BRIEF · SAMPLE GUEST C</div><h3>In one line</h3><p>Early-stage investor who has backed consumer brands outside the metros.</p><h3>Already covered on the show</h3><p>First hires, pricing for small towns, why boards matter early. Avoid repeating these.</p><h3>Open questions</h3><p>What they got wrong in their first fund; how they judge founders in 30 minutes.</p></div>`,
  saved: () => `<div class="list">${CLIPS.filter(c => saved.has(c.id)).map(rowHTML).join("")}</div>`,
  insights: () => `<div class="stats"><div class="card stat"><div class="v">499</div><div class="k">Episodes indexed</div></div><div class="card stat"><div class="v">429</div><div class="k">Unique guests</div></div><div class="card stat"><div class="v">96%</div><div class="k">Answer accuracy in review</div></div></div>`,
};

/* ---------- player ---------- */
function getClip(id) { return CLIPS.find(c => c.id === id); }
function play(c, from) {
  if (!P.clip || P.clip.id !== c.id) { P.clip = c; P.pos = from || 0; }
  P.playing = true; P.last = performance.now(); cancelAnimationFrame(P.raf); P.raf = requestAnimationFrame(tick);
  if (page === "clips" && c.src === "clips") render(); else syncPlayer();
}
function pause() { P.playing = false; cancelAnimationFrame(P.raf); syncPlayer(); }
function tick(now) {
  P.pos = Math.min(P.clip.len, P.pos + (now - P.last) / 1000); P.last = now;
  if (P.pos >= P.clip.len) { P.playing = false; syncPlayer(); toast("Clip ended"); return; }
  paint(); P.raf = requestAnimationFrame(tick);
}
function onSource() { return P.clip && $(`.player[data-clip="${P.clip.id}"]`); }
function paint() {
  if (!P.clip) return;
  const pct = (P.pos / P.clip.len * 100) + "%";
  const big = onSource();
  if (big) { $("#bigBar").style.width = pct; $("#bigTime").textContent = fmt(P.pos) + " / " + fmt(P.clip.len); }
  $("#mBar").style.width = pct; $("#mTs").textContent = fmt(P.clip.st + P.pos);
}
function syncPlayer() {
  const big = onSource();
  const bb = $("#bigBtn"); if (bb) bb.innerHTML = ico(big && P.playing ? "i-pause" : "i-play");
  const showMini = !!P.clip && !big && (P.playing || P.pos > 0);
  $("#mini").hidden = !showMini; document.body.classList.toggle("has-mini", showMini);
  if (P.clip) { $("#mT").textContent = P.clip.t; $("#mG").textContent = P.clip.ep; $("#mPlay").innerHTML = ico(P.playing ? "i-pause" : "i-play"); $("#mPlay").setAttribute("aria-label", P.playing ? "Pause" : "Play"); }
  paint();
}
$("#mPlay").addEventListener("click", () => P.playing ? pause() : play(P.clip));
$("#mClose").addEventListener("click", () => { pause(); P.clip = null; P.pos = 0; syncPlayer(); });
$("#mBack").addEventListener("click", () => { const c = P.clip; go(c.src, true); });
$("#mTrack").addEventListener("click", e => seek(e, $("#mTrack")));
function seek(e, el) { if (!P.clip) return; const r = el.getBoundingClientRect(); P.pos = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * P.clip.len; paint(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle],[data-play],[data-save],[data-copy],[data-dl],[data-rep],[data-seek],[data-e],#retry");
  if (!t) return;
  if (t.id === "retry") { mode = "normal"; setSeg(); render("loading"); loadT = setTimeout(() => render(), 650); return; }
  if (t.dataset.e) { mode = "normal"; setSeg(); go(t.dataset.e === "saved" ? "clips" : t.dataset.e, true); return; }
  if (t.dataset.toggle) { const c = getClip(t.dataset.toggle); (P.clip && P.clip.id === c.id && P.playing) ? pause() : play(c); return; }
  if (t.dataset.play) { const c = getClip(t.dataset.play); if (page !== "clips" && page !== c.src) { play(c, 0); toast("Playing in mini player"); } else play(c, P.clip && P.clip.id === c.id ? P.pos : 0); if (page === "clips") render(); return; }
  if (t.dataset.seek) { if (!P.clip || P.clip.id !== t.dataset.seek) { P.clip = getClip(t.dataset.seek); P.pos = 0; } seek(e, t); return; }
  const c = getClip(t.dataset.save || t.dataset.copy || t.dataset.dl || t.dataset.rep);
  if (t.dataset.save) {
    const was = saved.has(c.id); was ? saved.delete(c.id) : saved.add(c.id); render();
    toast(was ? "Removed from Saved" : "Saved to Watch later", () => { was ? saved.add(c.id) : saved.delete(c.id); render(); });
  } else if (t.dataset.copy) {
    const done = () => toast("Timestamp link copied"); try { navigator.clipboard.writeText(`${c.ep} · ${c.t} · ${fmt(c.st)}`).then(done, done); } catch (_) { done(); }
  } else if (t.dataset.dl) toast("Download started (clip download comes from the team's own tool)");
  else if (t.dataset.rep) openReport(c);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.toggle) { e.preventDefault(); e.target.click(); } });

/* ---------- toasts ---------- */
function toast(msg, undo) {
  const box = $("#toasts"); while (box.children.length >= 3) box.firstChild.remove();
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `${ico("i-check", "ok")}<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ""}`;
  if (undo) el.querySelector("button").onclick = () => { undo(); kill(); toast("Undone"); };
  box.appendChild(el);
  let t = setTimeout(kill, undo ? 5000 : 3200);
  el.addEventListener("mouseenter", () => clearTimeout(t)); el.addEventListener("mouseleave", () => { t = setTimeout(kill, 1600); });
  function kill() { clearTimeout(t); el.classList.add("out"); setTimeout(() => el.remove(), 260); }
}

/* ---------- report ---------- */
const REASONS = [["Wrong timestamp", "The clip starts or ends in the wrong place"], ["Wrong speaker", "Someone else said this"], ["Wrong fact or quote", "The answer says something the episode doesn't"], ["Transcript error", "Words are mis-heard or mis-spelt"], ["Something else", ""]];
let repClip = null;
function openReport(c) {
  repClip = c; $("#repS").textContent = `${c.ep} · ${c.t} · ${fmt(c.st)}`;
  $("#repO").innerHTML = REASONS.map(([r, d], i) => `<label class="opt"><input type="radio" name="why" value="${i}"><span>${r}${d ? `<small>${d}</small>` : ""}</span></label>`).join("");
  $("#repN").value = ""; $("#repC").textContent = "0 / 280"; $("#repGo").disabled = true; $("#rep").showModal();
}
$("#repO").addEventListener("change", () => $("#repGo").disabled = false);
$("#repN").addEventListener("input", e => $("#repC").textContent = e.target.value.length + " / 280");
$("#rep").addEventListener("close", () => { if ($("#rep").returnValue === "send" && repClip) { reported.add(repClip.id); render(); toast("Reported. Thanks, it goes to the review queue."); } $("#rep").returnValue = ""; });

/* ---------- quick search ---------- */
const IDX = [
  ...PAGES.map(([k, l]) => ({ g: "Pages", k: "i-page", l, s: "Go to page", act: () => go(k) })),
  ...GUESTS.map(([n, r]) => ({ g: "Guests", k: "i-user", l: n, s: r, act: () => { go("guests"); } })),
  ...CLIPS.map(c => ({ g: "Episodes and clips", k: "i-ep", l: c.t, s: `${c.ep} · ${fmt(c.st)}`, act: () => play(c, 0) })),
];
let pSel = 0, pItems = [];
function openPal() { $("#pq").value = ""; drawPal(); $("#pal").showModal(); $("#pq").focus(); }
function drawPal() {
  const q = $("#pq").value.trim().toLowerCase();
  pItems = IDX.filter(x => !q || (x.l + " " + x.s).toLowerCase().includes(q)).slice(0, 10);
  if (q) pItems.unshift({ g: "Ask", k: "i-ask", l: `Ask Cuepoint: “${$("#pq").value.trim()}”`, s: "Enter", act: () => { go("ask"); toast("Question sent to Ask"); } });
  pSel = 0;
  if (!pItems.length) { $("#pres").innerHTML = `<div class="pnone">Nothing found. Try a guest name or a topic.</div>`; return; }
  let html = "", g = "";
  pItems.forEach((x, i) => { if (x.g !== g) { g = x.g; html += `<div class="pg">${g}</div>`; } html += `<div class="pr" role="option" id="po${i}" data-i="${i}" aria-selected="${i === pSel}"><span class="k">${ico(x.k)}</span><span>${esc(x.l)}</span><span class="s">${esc(x.s)}</span></div>`; });
  $("#pres").innerHTML = html; $("#pq").setAttribute("aria-activedescendant", "po0");
}
function selPal(i) { pSel = (i + pItems.length) % pItems.length; document.querySelectorAll(".pr").forEach(el => el.setAttribute("aria-selected", +el.dataset.i === pSel)); const el = $("#po" + pSel); if (el) { el.scrollIntoView({ block: "nearest" }); $("#pq").setAttribute("aria-activedescendant", el.id); } }
function runPal(i) { const x = pItems[i]; if (!x) return; $("#pal").close(); x.act(); }
$("#pq").addEventListener("input", drawPal);
$("#pq").addEventListener("keydown", e => { if (e.key === "ArrowDown") { e.preventDefault(); selPal(pSel + 1); } else if (e.key === "ArrowUp") { e.preventDefault(); selPal(pSel - 1); } else if (e.key === "Enter") { e.preventDefault(); runPal(pSel); } });
$("#pres").addEventListener("click", e => { const r = e.target.closest(".pr"); if (r) runPal(+r.dataset.i); });
$("#pres").addEventListener("mousemove", e => { const r = e.target.closest(".pr"); if (r && +r.dataset.i !== pSel) selPal(+r.dataset.i); });
$("#pal").addEventListener("click", e => { if (e.target === $("#pal")) $("#pal").close(); });
$("#rep").addEventListener("click", e => { if (e.target === $("#rep")) $("#rep").close(); });
$("#qs").addEventListener("click", openPal);
if (/Mac|iPhone|iPad/.test(navigator.platform)) $("#kbd").textContent = "⌘K";
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#pal").open ? $("#pal").close() : openPal(); }
  else if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")) { e.preventDefault(); openPal(); }
});

/* ---------- mockup state strip ---------- */
function setSeg() { document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === mode)); }
$("#seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; mode = b.dataset.m; setSeg(); clearTimeout(loadT); render(); });

renderNav(); render();
</script>
</body>
</html>
