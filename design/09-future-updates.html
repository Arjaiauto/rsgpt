/* Layout: sticky top bar; heading + toolbar; responsive card grid (4/3/2/1) */
:root{
  --paper:#101117; --paper-lit:#1a1b24; --paper-edge:#08090c;
  --surface:#15161e; --raised:#1d1e28; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --ink:#f2f2f5; --ink-soft:rgba(242,242,245,.6); --ink-faint:rgba(242,242,245,.4);
  --violet:#5b07fb; --violet-deep:#4a00d6; --violet-text:#a58bff; --cite:#4fe3c1;
  --gutter:clamp(16px,3.2vw,46px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Inter","Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%,var(--paper-lit) 0%,var(--paper) 55%,var(--paper-edge) 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--violet-text);outline-offset:3px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:26px;height:60px;
  padding-left:max(16px,var(--gutter),env(safe-area-inset-left,0px));padding-right:max(16px,var(--gutter),env(safe-area-inset-right,0px));
  background:rgba(16,17,23,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:20px;color:var(--ink);text-decoration:none}
.mk{width:26px;height:26px;flex:none;display:block}
.wm{font-weight:600;letter-spacing:-.05em;white-space:nowrap}
.ci{display:inline-block;position:relative;width:.27em;height:.545em;vertical-align:baseline}
.ci i{position:absolute;left:.075em;bottom:0;width:.12em;height:.545em;border-radius:.06em;background:currentColor}
.ci i::after{content:"";position:absolute;left:50%;top:-.33em;width:.25em;height:.21em;margin-left:-.125em;background:var(--cite);clip-path:polygon(6% 0,94% 0,50% 100%)}
.links{display:flex;gap:22px;font-size:15px;letter-spacing:-.02em}
.links a{color:var(--ink-soft);text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.links a[aria-current]{color:var(--ink);border-color:var(--violet)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(140deg,#7c3cff,#2bb79a)}


/* Layout: the deck fills the screen under the top bar; each slide is text left + flow infographic right; stacks on phones */
html,body{height:100%}
body{overflow:hidden}
.deck{position:relative;height:calc(100svh - 60px - env(safe-area-inset-top,0px));overflow:hidden}
.track{display:flex;height:100%;transition:transform .6s var(--ease);will-change:transform}
.slide{flex:0 0 100%;height:100%;overflow-y:auto;display:flex;align-items:center;
  padding-block:clamp(24px,5vh,56px) 110px;padding-left:max(16px,var(--gutter),env(safe-area-inset-left,0px));padding-right:max(16px,var(--gutter),env(safe-area-inset-right,0px))}
.in{width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,72px);align-items:center}
.k{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--violet-text)}
.k b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(91,7,251,.18);border:1px solid rgba(165,139,255,.35);color:var(--ink);font-size:14px;letter-spacing:0}
.t{margin:0;font-size:clamp(32px,4.6vw,60px);font-weight:500;line-height:1.02;letter-spacing:-.05em;text-wrap:balance}
.tag{margin:14px 0 0;font-size:clamp(16px,1.6vw,19px);line-height:1.5;color:var(--ink-soft);max-width:40ch}
.facts{margin:26px 0 0;display:flex;flex-direction:column;gap:14px;max-width:48ch}
.f{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;font-size:15px;line-height:1.55}
.f span{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-size:13.5px}
.chip.time{color:var(--cite);border-color:rgba(79,227,193,.35);background:rgba(79,227,193,.08)}
.chip.who{color:var(--ink-soft)}
.cite{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid rgba(79,227,193,.3);background:rgba(79,227,193,.09);color:var(--cite);font-size:12.5px;font-weight:500;vertical-align:1px;white-space:nowrap}
.cite::before{content:"";border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
/* infographic */
.viz{position:relative;padding:clamp(18px,3vw,32px);border-radius:26px;border:1px solid var(--line);background:radial-gradient(120% 90% at 20% 0%,rgba(91,7,251,.16),transparent 60%),var(--surface);min-width:0}
.flow{display:flex;flex-direction:column;gap:0}
.step{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px;align-items:center;padding:14px 0}
.step + .step::before{content:"";position:absolute;left:23px;top:-14px;height:28px;width:2px;background:linear-gradient(var(--violet),var(--violet-text))}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line-strong);color:var(--violet-text)}
.ic svg{width:22px;height:22px}
.step:last-child .ic{background:rgba(79,227,193,.1);border-color:rgba(79,227,193,.4);color:var(--cite)}
.step b{display:block;font-size:15.5px;font-weight:500;letter-spacing:-.01em}
.step small{display:block;margin-top:2px;font-size:13px;color:var(--ink-soft);line-height:1.45}
.on .step{animation:stepIn .5s var(--ease) both}
.on .step:nth-child(2){animation-delay:.12s}.on .step:nth-child(3){animation-delay:.24s}.on .step:nth-child(4){animation-delay:.36s}
@keyframes stepIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.ex{margin-top:18px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line-strong);font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.ex b{color:var(--ink);font-weight:500}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.cmp div{padding:12px;border-radius:12px;background:var(--raised);font-size:13px;line-height:1.45}
.cmp i{display:block;font-style:normal;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.cmp .bad i{color:#ff8a9a}.cmp .good i{color:var(--cite)}
/* intro + close */
.cover .in,.close .in{grid-template-columns:minmax(0,1fr);text-align:left}
.big{margin:0;font-size:clamp(44px,7.4vw,108px);font-weight:500;line-height:.98;letter-spacing:-.06em}
.big span{display:block;color:var(--ink-soft)}
.grid10{margin-top:34px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.g10{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1.35;cursor:pointer;text-align:left;transition:border-color .2s,transform .25s var(--ease)}
.g10:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.g10 b{display:block;font-size:12px;color:var(--violet-text);font-weight:500;margin-bottom:6px}
.offer{margin-top:28px;display:flex;flex-direction:column;gap:12px;max-width:62ch;font-size:17px;line-height:1.6;color:var(--ink-soft)}
.offer p{margin:0}
.offer b{color:var(--ink);font-weight:500}
/* controls */
.ctrl{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none}
.ctrl > *{pointer-events:auto}
.nav{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(29,30,40,.9);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .2s,opacity .2s}
.nav:hover{transform:scale(1.06)}
.nav[disabled]{opacity:.3;cursor:default;transform:none}
.nav svg{width:18px;height:18px}
.dots{display:flex;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(29,30,40,.85);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:rgba(255,255,255,.22);cursor:pointer;transition:width .3s var(--ease),background-color .3s}
.dot[aria-current="true"]{width:24px;background:var(--violet-text)}
.num{position:absolute;right:max(16px,var(--gutter),env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.prog{position:absolute;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--violet),var(--cite));transition:width .6s var(--ease)}
@media (max-width:900px){.in{grid-template-columns:minmax(0,1fr);gap:24px}.grid10{grid-template-columns:repeat(2,minmax(0,1fr))}.slide{align-items:flex-start}}
@media (max-width:820px){.links{display:none}.me span:last-child{display:none}.num{display:none}}
@media (max-width:520px){.ctrl{bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(16,17,23,0),var(--paper) 40%)}.f{grid-template-columns:minmax(0,1fr);gap:2px}.cmp{grid-template-columns:minmax(0,1fr)}.dots{display:none}}
@media (prefers-reduced-motion:reduce){.track,.prog{transition:none}.on .step{animation:none}}
</style>

slides.push(`<section class="slide cover" aria-label="Slide 1"><div class="in"><div><p class="k">Future updates</p><h1 class="big">What Cuepoint<span>could do next</span></h1>
  <p class="tag" style="max-width:56ch">Ten features that could be built for the team, each starting from a real problem. Pick any one to see how it would work and how long it would take.</p>
  <div class="grid10">${F.map((f, i) => `<button class="g10" type="button" data-go="${i + 1}"><b>${String(i + 1).padStart(2, "0")}</b>${f.t}</button>`).join("")}</div></div></div></section>`);
F.forEach((f, i) => slides.push(`<section class="slide" aria-label="Slide ${i + 2}: ${f.t}"><div class="in">
  <div><p class="k"><b>${i + 1}</b>Future update</p><h2 class="t">${f.t}</h2><p class="tag">${f.tag}</p>
    <div class="facts"><div class="f"><span>Problem</span><div>${f.problem}</div></div><div class="f"><span>How</span><div>${f.how}</div></div></div>
    <div class="chips"><span class="chip who">${f.who}</span><span class="chip time">About ${f.time} to build</span></div></div>
  <div class="viz"><div class="flow">${f.steps.map(s => `<div class="step">${ic(s[0])}<div><b>${s[1]}</b><small>${s[2]}</small></div></div>`).join("")}</div>
    ${f.cmp ? `<div class="cmp"><div class="bad"><i>${f.cmp[0]}</i>${f.cmp[1]}</div><div class="good"><i>${f.cmp[2]}</i>${f.cmp[3]}</div></div>` : ""}
    ${f.ex ? `<div class="ex">${f.ex}${f.exLink ? ' <span class="cite">verified moment</span>' : ""}</div>` : ""}</div>
</div></section>`));
slides.push(`<section class="slide close" aria-label="Slide ${F.length + 2}"><div class="in"><div><p class="k">Next step</p><h2 class="big">Built on your files,<span>with your team</span></h2>
  <div class="offer"><p>Every feature here gets better on <b>Figuring Out's own raw recordings</b>: word-perfect transcripts, clean clip exports and no YouTube limits.</p>
  <p>I'd start with whichever one saves the team the most hours, ship it in weeks, and measure it.</p>
  <p>This demo stays private, and I'll take it down whenever you ask.</p></div></div></div></section>`);

const track = $("#track"); track.innerHTML = slides.join("");
const N = slides.length; let cur = 0;
$("#dots").innerHTML = Array.from({ length: N }, (_, i) => `<button class="dot" type="button" role="tab" aria-label="Go to slide ${i + 1}" data-go="${i}"></button>`).join("");
const els = [...track.children];
function go(i) {
  cur = Math.max(0, Math.min(N - 1, i));
  track.style.transform = `translateX(${-cur * 100}%)`;
  els.forEach((s, k) => { s.classList.toggle("on", k === cur); s.setAttribute("aria-hidden", String(k !== cur)); s.inert = k !== cur; if (k === cur) s.scrollTop = 0; });
  document.querySelectorAll(".dot").forEach((d, k) => d.setAttribute("aria-current", String(k === cur)));
  $("#prev").disabled = cur === 0; $("#next").disabled = cur === N - 1;
  $("#num").textContent = `${cur + 1} / ${N}`; $("#prog").style.width = ((cur + 1) / N * 100) + "%";
}
$("#prev").addEventListener("click", () => go(cur - 1)); $("#next").addEventListener("click", () => go(cur + 1));
document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) go(+g.dataset.go); });
addEventListener("keydown", e => { if (e.target.closest("input,textarea,select")) return; if (e.key === "ArrowRight" || e.key === "PageDown") go(cur + 1); else if (e.key === "ArrowLeft" || e.key === "PageUp") go(cur - 1); else if (e.key === "Home") go(0); else if (e.key === "End") go(N - 1); });
let sx = null, sy = 0;
$("#deck").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("#deck").addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) go(cur + (dx < 0 ? 1 : -1)); sx = null; }, { passive: true });
go(0);
})();
</script>
