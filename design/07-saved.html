<title>Cuepoint Saved Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cuepoint saved items mockup: clips, answers and briefs in folders with notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&display=swap">
<style>

/* Layout: sticky top bar; heading + toolbar; responsive card grid (4/3/2/1) */
:root{
  --paper:#101117; --paper-lit:#1a1b24; --paper-edge:#08090c;
  --surface:#15161e; --raised:#1d1e28; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --ink:#f2f2f5; --ink-soft:rgba(242,242,245,.6); --ink-faint:rgba(242,242,245,.4);
  --violet:#5b07fb; --violet-deep:#4a00d6; --violet-text:#a58bff; --cite:#4fe3c1;
  --gutter:clamp(16px,3.2vw,46px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Inter","Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%,var(--paper-lit) 0%,var(--paper) 55%,var(--paper-edge) 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--violet-text);outline-offset:3px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:26px;height:60px;
  padding-left:max(16px,var(--gutter),env(safe-area-inset-left,0px));padding-right:max(16px,var(--gutter),env(safe-area-inset-right,0px));
  background:rgba(16,17,23,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:20px;color:var(--ink);text-decoration:none}
.mk{width:26px;height:26px;flex:none;display:block}
.wm{font-weight:600;letter-spacing:-.05em;white-space:nowrap}
.ci{display:inline-block;position:relative;width:.27em;height:.545em;vertical-align:baseline}
.ci i{position:absolute;left:.075em;bottom:0;width:.12em;height:.545em;border-radius:.06em;background:currentColor}
.ci i::after{content:"";position:absolute;left:50%;top:-.33em;width:.25em;height:.21em;margin-left:-.125em;background:var(--cite);clip-path:polygon(6% 0,94% 0,50% 100%)}
.links{display:flex;gap:22px;font-size:15px;letter-spacing:-.02em}
.links a{color:var(--ink-soft);text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
.links a[aria-current]{color:var(--ink);border-color:var(--violet)}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(140deg,#7c3cff,#2bb79a)}


/* Layout: folder sidebar on the left, tabs + item list on the right; sidebar becomes a chip row on phones */
main{width:100%;max-width:1180px;margin:0 auto;padding-block:40px 100px;
  padding-left:max(16px,var(--gutter),env(safe-area-inset-left,0px));padding-right:max(16px,var(--gutter),env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
h1{margin:0;font-size:clamp(38px,6vw,72px);font-weight:500;line-height:1;letter-spacing:-.055em}
.whose{margin:10px 0 0;font-size:14.5px;color:var(--ink-soft)}
.whose b{color:var(--ink);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;transition:border-color .2s,transform .25s var(--ease)}
.btn:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.btn.pri{background:var(--violet);border-color:transparent;color:#fff}
.btn.pri:hover{background:var(--violet-deep)}
.layout{margin-top:32px;display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:clamp(20px,3vw,36px);align-items:start}
.folders{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px}
.folders h2{margin:0 0 8px 12px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.fd{display:flex;align-items:center;justify-content:space-between;gap:10px;height:42px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:var(--ink-soft);font-size:14.5px;cursor:pointer;text-align:left}
.fd:hover{background:var(--surface);color:var(--ink)}
.fd[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.fd span{font-size:12.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.fd .ic{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:9px}
.newf{display:flex;gap:6px;margin-top:8px}
.newf input{flex:1;min-width:0;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-size:13.5px;outline:none}
.newf input:focus-visible{border-color:var(--violet-text)}
.newf button{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.tab{height:36px;padding:0 16px;border-radius:999px;border:0;background:transparent;color:var(--ink-soft);font-size:14px;font-weight:500;cursor:pointer}
.tab span{margin-left:6px;font-size:12px;color:var(--ink-faint)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,opacity .3s,transform .3s var(--ease),max-height .35s var(--ease),padding .35s,margin .35s;max-height:400px;animation:rise .4s var(--ease) both}
.it:hover{border-color:var(--line-strong)}
.it.out{opacity:0;transform:translateX(16px);max-height:0;padding-block:0;margin-top:-10px;border-width:0;overflow:hidden}
.thumb{position:relative;width:74px;aspect-ratio:9/16;border-radius:12px;overflow:hidden;display:grid;place-items:center;flex:none}
.thumb.sq{aspect-ratio:1/1;width:56px;border-radius:14px;background:var(--raised);color:var(--violet-text)}
.thumb.sq svg{width:24px;height:24px}
.thumb .len{position:absolute;left:6px;bottom:6px;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.5);font-size:10.5px;font-weight:500;color:var(--cite)}
.thumb .pl{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center}
.thumb .pl svg{width:12px;height:12px;margin-left:2px}
.bd{min-width:0;display:flex;flex-direction:column;gap:8px}
.bd b{font-size:15.5px;font-weight:500;line-height:1.4;letter-spacing:-.01em}
.bd .m{font-size:13px;color:var(--ink-faint)}
.note{width:100%;min-height:34px;padding:7px 12px;border-radius:10px;border:1px dashed var(--line-strong);background:transparent;color:var(--ink);font:400 13.5px/1.4 var(--sans);resize:none;outline:none}
.note::placeholder{color:var(--ink-faint)}
.note:focus{border-style:solid;border-color:var(--violet-text);background:var(--raised)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mini{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-size:13px;cursor:pointer}
.mini:hover{border-color:var(--line-strong)}
.mini.cite{color:var(--cite);border-color:rgba(79,227,193,.35);background:rgba(79,227,193,.08)}
.fsel{height:32px;padding:0 30px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-size:13px;cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 16px) 14px,calc(100% - 11px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.fsel option{background:var(--raised)}
.rm{margin-left:auto;border:0;background:none;color:var(--ink-faint);font-size:13px;cursor:pointer}
.rm:hover{color:var(--ink)}
.saved-tag{font-size:11.5px;color:var(--ink-faint)}
.empty{padding:50px 20px;text-align:center;border:1px dashed var(--line-strong);border-radius:20px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .row{display:flex;gap:8px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.foot{text-align:center;font-size:12.5px;color:var(--ink-faint);margin:50px 0 0}
.tnote{margin:22px 0 0;font-size:12.5px;color:var(--ink-faint)}
.toast{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:999px;background:var(--raised);border:1px solid var(--line-strong);font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.45);animation:rise .3s var(--ease) both}
.toast button{height:30px;padding:0 12px;border-radius:999px;border:0;background:var(--violet);color:#fff;font-size:13px;font-weight:500;cursor:pointer}
@media (max-width:820px){.links{display:none}.me span:last-child{display:none}
  .layout{grid-template-columns:minmax(0,1fr)}
  .folders{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:6px}
  .folders::-webkit-scrollbar{display:none}
  .folders h2,.newf{display:none}
  .fd{flex:none;height:36px;border-radius:999px;border:1px solid var(--line)}
  .tabs{width:100%;overflow-x:auto}.tab{flex:1 0 auto}}
@media (prefers-reduced-motion:reduce){.it,.toast{animation:none;transition:none}}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><linearGradient id="cp-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3cff"/><stop offset=".55" stop-color="#5b07fb"/><stop offset="1" stop-color="#3a0aa8"/></linearGradient></defs>
  <symbol id="cp-mark" viewBox="0 0 56 56">
    <rect width="56" height="56" rx="16" fill="url(#cp-g)"/>
    <g fill="#fff" opacity=".38"><rect x="10.5" y="27" width="3.2" height="8" rx="1.6"/><rect x="16.8" y="22.5" width="3.2" height="17" rx="1.6"/><rect x="36" y="20.5" width="3.2" height="21" rx="1.6"/><rect x="42.3" y="25" width="3.2" height="12" rx="1.6"/></g>
    <rect x="25.4" y="19" width="5.2" height="26" rx="2.6" fill="#fff"/>
    <path d="M20.6 9.6h14.8a1.6 1.6 0 0 1 1.2 2.7l-7.4 7.6a1.6 1.6 0 0 1-2.3 0l-7.4-7.6a1.6 1.6 0 0 1 1.1-2.7z" fill="#4fe3c1"/>
  </symbol>
</svg>

<header class="bar">
  <a class="logo" href="#"><svg class="mk" aria-hidden="true"><use href="#cp-mark"/></svg><span class="sr">Cuepoint</span><span class="wm" aria-hidden="true">cuepo<span class="ci"><i></i></span>nt</span></a>
  <nav class="links" aria-label="Main"><a href="#">Ask</a><a href="#">Guests</a><a href="#">Prep brief</a><a href="#">Clips</a><a href="#" aria-current="page">Saved</a><a href="#">Insights</a></nav>
  <div class="me"><span class="av" aria-hidden="true">A</span><span>Hi Arjun</span></div>
</header>


<main>
  <div class="head">
    <div><h1>Saved</h1><p class="whose"><b>Arjun's</b> saved items · kept on this browser</p></div>
    <button class="btn" type="button" id="csv">Export all clips as CSV</button>
  </div>
  <div class="layout">
    <nav class="folders" aria-label="Folders" id="folders"></nav>
    <div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="list" id="list"></div>
      <p class="tnote">Mockup: items are sample data. Notes and folders save as you type on the live site.</p>
    </div>
  </div>
  <p class="foot">Unofficial project, not affiliated with Figuring Out. Every answer links to its source.</p>
</main>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const FCOL = { "Reel ideas": "#ff8ab0", "Guest prep: Nikhil": "#a58bff", "Health series": "#4fe3c1" };
let folders = ["Reel ideas", "Guest prep: Nikhil", "Health series"];
let items = [
  { id: 1, kind: "clip", t: "“Meri pehli video pe 12 views the. Aur unme se 9 meri mummy ke the.”", m: "Sana Qureshi · Aug 2025 · 18:44", len: "0:41", h: 280, f: "Reel ideas", note: "Use for Monday reel" },
  { id: 2, kind: "clip", t: "“The night before the final, I didn't sleep at all.”", m: "Kabir Singh · Apr 2024 · 33:10", len: "0:58", h: 60, f: "Reel ideas", note: "" },
  { id: 3, kind: "clip", t: "“Weekend pe late uthna matlab har Monday ko jet lag.”", m: "Dr Vikram Sethi · Jun 2025 · 22:40", len: "0:38", h: 200, f: "Health series", note: "Pair with nutrition clip" },
  { id: 4, kind: "clip", t: "“Most startups should never raise venture money.”", m: "Rohan Mehta · Jan 2026 · 1:02:40", len: "1:03", h: 320, f: "Guest prep: Nikhil", note: "" },
  { id: 5, kind: "answer", t: "What have founders said about raising their first round?", m: "3 sources · asked 27 Oct", sub: "Several founders said their first cheque came from people who already knew their work.", f: "Guest prep: Nikhil", note: "Good background for the funding section" },
  { id: 6, kind: "answer", t: "Health aur sleep pe guests ne kya kaha?", m: "3 sources · asked 26 Oct", sub: "Ek sleep doctor ne kaha ki roz ek hi time pe sona aur uthna chahiye.", f: "Health series", note: "" },
  { id: 7, kind: "brief", t: "Nikhil Kamath", m: "Prep brief · 27 Oct · 5 sections", sub: "Co-founder of Zerodha, investor", f: "Guest prep: Nikhil", note: "Send to the research team" }
];
let tab = "clip", folder = "";
const ICON = { answer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5h14v10H9l-4 4z"/></svg>', brief: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>' };
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
function drawFolders() {
  const n = f => items.filter(i => !f || i.f === f).length;
  $("#folders").innerHTML = `<h2>Folders</h2><button class="fd" type="button" aria-pressed="${!folder}" data-f="">All saved<span>${n("")}</span></button>` +
    folders.map(f => `<button class="fd" type="button" aria-pressed="${folder === f}" data-f="${esc(f)}"><span style="color:var(--ink-soft);font-size:14.5px"><i class="ic" style="background:${FCOL[f] || "#9aa0b4"}"></i>${esc(f)}</span><span>${n(f)}</span></button>`).join("") +
    `<form class="newf" id="newf"><label class="sr" for="nf">New folder name</label><input id="nf" placeholder="New folder" maxlength="30"><button type="submit">Add</button></form>`;
}
function drawTabs() {
  const n = k => items.filter(i => i.kind === k && (!folder || i.f === folder)).length;
  $("#tabs").innerHTML = [["clip", "Clips"], ["answer", "Answers"], ["brief", "Prep briefs"]].map(([k, l]) => `<button class="tab" role="tab" type="button" aria-selected="${tab === k}" data-k="${k}">${l}<span>${n(k)}</span></button>`).join("");
}
function drawList() {
  const list = items.filter(i => i.kind === tab && (!folder || i.f === folder));
  if (!list.length) { $("#list").innerHTML = `<div class="empty"><b>Nothing saved here yet.</b><span>Tap Save on any clip, answer or brief and it appears here.</span><div class="row"><button class="btn" type="button">Find clips</button><button class="btn pri" type="button">Ask a question</button></div></div>`; return; }
  $("#list").innerHTML = list.map(i => {
    const hue = i.h || 260;
    const thumb = i.kind === "clip" ? `<div class="thumb" style="background:radial-gradient(120% 80% at 30% 10%,hsl(${hue} 50% 34%),transparent 65%),#0d0e14"><span class="pl">${PLAY}</span><span class="len">${i.len}</span></div>` : `<div class="thumb sq">${ICON[i.kind]}</div>`;
    const act = i.kind === "clip" ? `<button class="mini cite" type="button" data-play="${i.id}">Play</button>` : `<button class="mini" type="button" data-open="${i.id}">Open</button>`;
    return `<article class="it" data-id="${i.id}">${thumb}<div class="bd"><b>${esc(i.t)}</b>${i.sub ? `<span style="font-size:14px;color:var(--ink-soft);line-height:1.5">${esc(i.sub)}</span>` : ""}<span class="m">${esc(i.m)}</span>
      <label class="sr" for="n${i.id}">Note</label><textarea class="note" id="n${i.id}" rows="1" placeholder="Add a note" data-note="${i.id}">${esc(i.note)}</textarea>
      <div class="ctl">${act}<label class="sr" for="f${i.id}">Folder</label><select class="fsel" id="f${i.id}" data-fold="${i.id}"><option value="">No folder</option>${folders.map(f => `<option${i.f === f ? " selected" : ""}>${esc(f)}</option>`).join("")}</select><button class="rm" type="button" data-rm="${i.id}">Remove</button></div></div></article>`;
  }).join("");
}
const all = () => { drawFolders(); drawTabs(); drawList(); };
$("#folders").addEventListener("click", e => { const b = e.target.closest(".fd"); if (!b) return; folder = b.dataset.f; all(); });
$("#folders").addEventListener("submit", e => { e.preventDefault(); const v = $("#nf").value.trim(); if (!v) return; if (!folders.includes(v)) folders.push(v); folder = v; all(); toast(`Folder “${v}” created`); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; tab = b.dataset.k; drawTabs(); drawList(); });
$("#list").addEventListener("input", e => { const n = e.target.closest("[data-note]"); if (!n) return; items.find(i => i.id === +n.dataset.note).note = n.value; clearTimeout(n._t); n._t = setTimeout(() => toast("Note saved"), 700); });
$("#list").addEventListener("change", e => { const s = e.target.closest("[data-fold]"); if (!s) return; items.find(i => i.id === +s.dataset.fold).f = s.value; toast(s.value ? `Moved to “${s.value}”` : "Removed from folder"); drawFolders(); if (folder && s.value !== folder) { drawTabs(); drawList(); } });
$("#list").addEventListener("click", e => {
  const r = e.target.closest("[data-rm]");
  if (r) {
    const id = +r.dataset.rm, idx = items.findIndex(i => i.id === id), it = items[idx], el = r.closest(".it");
    el.classList.add("out");
    setTimeout(() => { items.splice(items.indexOf(it), 1); all(); toast("Removed", () => { items.splice(idx, 0, it); all(); }); }, 320);
    return;
  }
  if (e.target.closest("[data-play]")) return toast("Live site: opens the clip player with its transcript");
  if (e.target.closest("[data-open]")) return toast(tab === "brief" ? "Live site: opens this prep brief" : "Live site: opens this answer thread on Ask");
  if (e.target.closest(".empty .btn")) toast("Live site: goes to " + e.target.textContent);
});
$("#csv").addEventListener("click", () => toast(`Live site: downloads ${items.filter(i => i.kind === "clip").length} clips (episode, guest, start, link, note) as a CSV`));
let tEl, tT;
function toast(m, undo) { tEl && tEl.remove(); clearTimeout(tT); tEl = document.createElement("div"); tEl.className = "toast"; tEl.setAttribute("role", "status"); tEl.innerHTML = `<span>${esc(m)}</span>` + (undo ? '<button type="button">Undo</button>' : ""); document.body.appendChild(tEl);
  if (undo) tEl.querySelector("button").addEventListener("click", () => { undo(); tEl.remove(); tEl = null; });
  tT = setTimeout(() => { tEl && tEl.remove(); tEl = null; }, undo ? 5000 : 2200); }
all();
})();
</script>
